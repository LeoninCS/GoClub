name: PR Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Hugo site
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.159.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Check URL slugs
        run: python3 scripts/check_slugs.py

      - name: Check share shortlinks
        shell: bash
        # 短链属于站点运维细节，不该卡住投稿者。
        # 缺失只做提示，合并到 main 后由 shortlink-sync workflow 自动补齐。
        run: |
          if python3 scripts/gen_shortlinks.py --check; then
            exit 0
          fi
          echo "::notice::上面这些页面还没有 /s/ 分享短链。这不影响本 PR 合并，合并到 main 后会自动补齐，无需处理。"

      - name: Generate contributors data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONTRIBUTORS_OUTPUT: data/contributors.json
        run: python3 scripts/generate_contributors.py

      - name: Build
        run: hugo --minify

      - name: Check search index coverage
        run: python3 scripts/check_search_index.py --site public
