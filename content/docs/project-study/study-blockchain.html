.card-actions{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--border);padding-top:10px}.card-action{padding:5px 12px;border-radius:9px;font-size:11px;font-weight:950;color:#fff}.card-action.practice{background:var(--green)}.card-action.review{background:var(--warn)}
.table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;font-size:13.5px}.table th{color:var(--fg3);text-align:left;padding:10px 14px;font-size:12px;text-transform:uppercase}.table td{padding:10px 14px;border-top:1px solid var(--border);color:var(--fg2);vertical-align:top}
.search-result{padding:14px 18px;margin:8px 0;cursor:pointer}.search-result:hover{border-color:var(--accent)}.sr-mode{font-size:10px;font-weight:950;color:var(--accent);letter-spacing:.6px;text-transform:uppercase}.sr-title{font-size:14px;font-weight:900;color:var(--fg);margin-top:2px}.sr-snippet{font-size:13px;color:var(--fg3);line-height:1.55;margin-top:4px}mark{background:var(--accent-glow);color:var(--accent);border-radius:3px;padding:1px 3px;font-weight:900}

<script>
const STORE="study-blockchain-progress-v1";
const S={mode:"intro",sec:0,ch:0,topic:0,dim:0,q:""};

const introData={
  title:"Nakamoto共识（Go语言）10天项目学习",
  desc:"从 Block 结构开始，用 10 个渐进步骤构建一个比特币式区块链系统。页面把原始文档拆成前言、知识学习、项目拆解、面试模拟和场景还原，目标是让你既能写出项目，也能把 PoW、UTXO、Merkle 树、P2P 同步和 Nakamoto 共识讲清楚。",
  pillars:[
    {title:"项目介绍",text:"这是一个 Go 语言实现的 Nakamoto 共识教学项目。代码从最小区块链起步，逐步加入 PoW、gob 序列化、BoltDB 持久化、CLI、UTXO 交易、钱包、Merkle 树和 P2P 网络，最后形成一条能同步、能交易、能解释共识规则的链。"},
    {title:"前置要求",text:"建议具备 Go 基础语法、哈希、序列化、KV 存储、命令行参数、ECDSA、TCP 网络和基础数据结构。区块链背景可以在学习过程中补齐。"},
    {title:"Level 1：能跑能演示",text:"能启动节点，创建钱包，生成创世区块，发起交易，同步区块，看到完整链路输出。"},
    {title:"Level 2：面试级理解",text:"能讲清区块结构、PoW 挖矿、UTXO、Merkle 树、P2P 消息和最长链规则。"},
    {title:"Level 3：抗追问能力",text:"能回答 targetBit、双花、分叉、网络分区、51% 攻击、地址校验和 SPV 证明等追问。"},
    {title:"Level 4：可独立复刻",text:"能关掉文档，从零复刻 Block、PoW、BoltDB、Transaction、Wallet、MerkleTree 和 P2P 网络。"},
    {title:"Level 5：分布式共识大师",text:"能把 Nakamoto 共识抽象成 PoW、最长链、概率最终性和开放网络安全模型。"},
    {title:"学习方法",text:"先看前言建立地图，再逐章学知识点，用 10 天项目拆解追源码，最后用面试卡片和场景题训练表达。"},
    {title:"最终产出",text:"学完后形成一张 Nakamoto 共识链路图、一份 10 步复刻路线、15 道高频追问答案、5 条简历亮点和一套共识系统回答框架。"}
  ],
  prerequisites:["Go 基础语法与错误处理","crypto/sha256 哈希计算","encoding/gob 序列化","BoltDB 嵌入式 KV 数据库","flag 命令行参数解析","ECDSA 椭圆曲线签名","net 包 TCP 网络编程","链表、树、哈希等基础数据结构"],
  levels:[
    {title:"Level 1：能跑能演示",standard:"能从零写 Block + Blockchain 并输出区块信息。",proof:"能画出 Block 结构体和链式连接关系。",next:"加入 PoW 挖矿。"},
    {title:"Level 2：面试级理解",standard:"能把项目讲成 Block → PoW → BoltDB → CLI → UTXO 的工程演化。",proof:"能回答每个模块为什么需要前一个模块。",next:"准备 UTXO、签名和网络同步追问。"},
    {title:"Level 3：抗追问能力",standard:"能解释网络分区时节点如何重新同步。",proof:"能把回答落到源码入口：handleVersion、handleInv、sendBlock。",next:"把核心模块背到可以复刻。"},
    {title:"Level 4：可独立复刻",standard:"能从零写出最小可运行区块链系统。",proof:"能还原目录结构、Block 结构体、PoW 验证和 P2P 协议。",next:"抽象成分布式共识设计框架。"},
    {title:"Level 5：分布式共识大师",standard:"能从项目上升到通用异步共识方法论。",proof:"能主动讨论 PoW、最长链、概率最终性和 51% 攻击。",next:"进入异步 BFT 学习。"}
  ],
  method:[
    {title:"先跑通",text:"用 CLI 跑出区块、交易和节点同步，先获得系统手感。"},
    {title:"再拆层",text:"按数据结构、共识、存储、交易、密码学、网络六条线拆源码。"},
    {title:"追链路",text:"把 createblockchain、addblock、send、printchain、node sync 串成端到端流程。"},
    {title:"背表达",text:"每个知识点都整理成 Level 1 概念、Level 2 源码、Level 3 追问。"},
    {title:"画图复盘",text:"用图表达区块连接、PoW 目标、UTXO 消费、Merkle Proof 和 P2P 同步。"},
    {title:"面试冲刺",text:"把项目介绍、源码入口、故障场景和扩展方案练到可以稳定输出。"}
  ],
  answerFrame:["一句话结论","项目位置","源码入口","核心机制","安全边界","追问扩展"],
  scorecard:[
    {title:"链路完整",text:"能从命令行入口追到数据存储和网络同步。"},
    {title:"源码可信",text:"每个结论都能指到核心文件、结构体和函数。"},
    {title:"机制清楚",text:"能解释 PoW、UTXO、Merkle、P2P 的安全意义。"},
    {title:"追问稳",text:"能处理分叉、双花、网络分区和 51% 攻击问题。"}
  ],
  outputs:["Bitcoin/Nakamoto 核心链路图","Block + PoW + UTXO 关系图","5 条简历亮点","15 道高频面试追问答案","10 步复刻路线图","Nakamoto 共识通用回答框架"]
};

const learnData=[
  {title:"第1章：区块与链",topics:[
    {q:"Block 结构体包含哪些字段？每个字段的作用是什么？",lv1:`<p>区块是区块链的最小存储单元，核心字段包括 Height、PrevBlockHash、Data、Timestamp 和 Hash。Height 表示高度，PrevBlockHash 负责连接前一个区块，Data 保存交易或业务数据，Timestamp 记录创建时间，Hash 是当前区块内容摘要。</p>`,lv2:`<p>源码入口在 <code class="inline">001-block/core/Block.go</code>。<code class="inline">SetHash()</code> 会拼接区块高度、前一区块哈希、数据和时间戳，再计算 SHA256。<code class="inline">Blockchain</code> 初期用 <code class="inline">[]*Block</code> 在内存中保存有序区块。</p>`,lv3:`<p><strong>追问方向：</strong>创世区块的 PrevBlockHash 为什么使用全 0？修改历史区块会如何影响后续 Hash？为什么 Hash 应由内容计算得到？</p>`},
    {q:"Blockchain 的 AddBlocktoBlockchain 方法做了什么？",lv1:`<p>它负责把新数据打包成区块，并追加到链尾。核心动作是找到最后一个区块，取出高度和 Hash，调用 NewBlock 创建新区块，然后 append 到 Blocks 切片。</p>`,lv2:`<p>源码入口在 <code class="inline">001-block/core/Blockchain.go</code>。早期版本的链只存在内存中，重启后数据会丢失，这为后面引入 BoltDB 持久化埋下伏笔。</p>`,lv3:`<p><strong>追问方向：</strong>追加区块前要验证哪些信息？内存切片模型为什么足够支撑第一步教学？持久化版本如何替换这个结构？</p>`}
  ],quiz:[
    {q:"Block 的五个核心字段是什么？",hint:"Height、PrevBlockHash、Data、Timestamp、Hash。"},
    {q:"为什么修改历史区块会破坏整条链？",hint:"后一区块保存的是前一区块 Hash，历史数据变化会造成后续 PrevBlockHash 失配。"},
    {q:"第一版 Blockchain 为什么重启后会丢数据？",hint:"它使用内存切片保存区块，进程退出后内存状态清空。"}
  ]},
  {title:"第2章：工作量证明（PoW）",topics:[
    {q:"PoW 的核心原理是什么？targetBit 的作用是什么？",lv1:`<p>PoW 的目标是找到一个 nonce，使区块哈希小于目标值 target。targetBit 表示目标难度的位数，targetBit 越大，目标值越小，找到有效 Hash 的难度越高。</p>`,lv2:`<p>源码入口在 <code class="inline">002-PoW/core/ProofOfWork.go</code>。<code class="inline">Run()</code> 从 nonce=0 开始循环，拼接区块字段和 nonce，计算 SHA256，并用大整数比较 <code class="inline">hashInt &lt; target</code>。</p>`,lv3:`<p><strong>追问方向：</strong>挖矿难、验证快体现在哪里？targetBit=16 平均要尝试多少次？Bitcoin 的难度如何动态调整？</p>`},
    {q:"prepareData 拼接了哪些数据？Nonce 在哪里？",lv1:`<p>prepareData 会把区块高度、前一区块 Hash、数据、时间戳、targetBit 和 nonce 拼在一起，生成待哈希字节数组。nonce 是矿工持续变化的试探值。</p>`,lv2:`<p>源码中 nonce 通常作为 <code class="inline">Run()</code> 循环变量传入 <code class="inline">prepareData(nonce)</code>。同一个区块内容下，nonce 的变化会产生完全不同的 SHA256 输出。</p>`,lv3:`<p><strong>追问方向：</strong>为什么 nonce 要进入哈希输入？如果 nonce 溢出怎么办？真实 Bitcoin 还会改变哪些字段继续搜索？</p>`}
  ],quiz:[
    {q:"PoW 验证为什么比挖矿快？",hint:"挖矿需要大量试 nonce；验证只计算一次哈希并比较 target。"},
    {q:"targetBit 增大意味着什么？",hint:"target 变小，有效 Hash 区间变窄，挖矿更难。"},
    {q:"nonce 的作用是什么？",hint:"给矿工提供可变输入，让同一块数据可以产生不同 Hash。"}
  ]},
  {title:"第3章：序列化",topics:[
    {q:"为什么需要 Blocks 序列化？gob 是什么？",lv1:`<p>区块需要写入磁盘和通过网络传输，内存对象需要转成字节数组。gob 是 Go 标准库提供的二进制编码格式，适合 Go 结构体之间的 encode/decode。</p>`,lv2:`<p>源码入口在 <code class="inline">003-Serialize/core/Block.go</code>。<code class="inline">Serialize()</code> 使用 <code class="inline">gob.NewEncoder</code> 把 Block 写入 buffer；<code class="inline">DeserializeBlock()</code> 使用 <code class="inline">gob.NewDecoder</code> 还原对象。</p>`,lv3:`<p><strong>追问方向：</strong>gob 的跨语言能力怎样？生产区块链为什么偏向 protobuf 或自定义编码？序列化字段变化如何兼容旧数据？</p>`}
  ],quiz:[
    {q:"序列化解决了什么问题？",hint:"把内存结构转成可存储、可传输的字节。"},
    {q:"gob 的优势是什么？",hint:"Go 原生、使用简单、适合教学项目。"},
    {q:"反序列化失败通常说明什么？",hint:"字节损坏、结构体字段变化或类型不匹配。"}
  ]},
  {title:"第4章：持久化存储（BoltDB）",topics:[
    {q:"BoltDB 如何替换内存存储？Blockchain 结构发生了什么变化？",lv1:`<p>BoltDB 把区块从内存切片迁移到本地 KV 存储。区块 Hash 作为 key，序列化后的 Block 作为 value，特殊 key <code class="inline">l</code> 保存最新区块 Hash。</p>`,lv2:`<p>源码入口在 <code class="inline">004-Persistence/core/Blockchain.go</code>。<code class="inline">Blockchain</code> 不再保存完整 Blocks 切片，而是保存 <code class="inline">Tip []byte</code> 和 <code class="inline">Db *bolt.DB</code>。</p>`,lv3:`<p><strong>追问方向：</strong>BoltDB 的事务模型是什么？key=l 为什么能快速定位链头？如果数据库损坏如何恢复？</p>`},
    {q:"BlockchainIterator 是如何工作的？",lv1:`<p>迭代器从 Tip 开始，读取当前区块，取出 PrevBlockHash，再继续读取前一个区块，直到创世区块。它用反向遍历还原整条链。</p>`,lv2:`<p>源码入口在 <code class="inline">004-Persistence/core/Blockchainiterator.go</code>。迭代器保存 <code class="inline">CurrentHash</code> 和 DB 引用，每次 <code class="inline">Next()</code> 在 BoltDB 只读事务中查当前 Hash。</p>`,lv3:`<p><strong>追问方向：</strong>反向遍历的时间复杂度是多少？如果需要按高度正向遍历，索引如何设计？</p>`}
  ],quiz:[
    {q:"BoltDB 中 key='l' 保存什么？",hint:"最新区块 Hash，也就是 Tip。"},
    {q:"Iterator 为什么从 Tip 往前走？",hint:"每个区块保存 PrevBlockHash，可以天然反向遍历。"},
    {q:"Blockchain 结构体持久化后主要保存什么？",hint:"Tip 和 DB 连接。"}
  ]},
  {title:"第5章：命令行接口（CLI）",topics:[
    {q:"CLI 模块的设计思路是什么？flag 包如何实现子命令？",lv1:`<p>CLI 把底层区块链能力暴露成命令，例如 createblockchain、addblock、printchain。用户通过命令行参数触发不同分支，方便演示和测试。</p>`,lv2:`<p>源码入口在 <code class="inline">005-CLI/cli/CLI.go</code>。Go 标准库 <code class="inline">flag.NewFlagSet</code> 可以为每个子命令维护独立参数解析逻辑。</p>`,lv3:`<p><strong>追问方向：</strong>CLI 如何组织命令帮助？参数校验放在哪里？真实节点命令和 RPC 接口如何分工？</p>`}
  ],quiz:[
    {q:"CLI 在这个项目中的价值是什么？",hint:"把链的能力变成可操作、可演示、可测试的入口。"},
    {q:"flag.NewFlagSet 适合做什么？",hint:"为每个子命令建立独立参数集合。"},
    {q:"printchain 通常依赖哪个模块？",hint:"BlockchainIterator。"}
  ]},
  {title:"第6章：持久化 + CLI 整合",topics:[
    {q:"整合后的项目目录结构和依赖关系是什么？",lv1:`<p>整合后，main 负责启动 CLI，CLI 调用 Blockchain，Blockchain 通过 BoltDB 存储区块，Block 通过序列化进出数据库。目录结构开始体现模块边界。</p>`,lv2:`<p>常见入口是 <code class="inline">main.go → cli.CLI.Run() → core.NewBlockchain()</code>。createblockchain 初始化数据库和创世区块；addblock 读取 Tip 后挖矿并更新 key=l；printchain 通过迭代器输出。</p>`,lv3:`<p><strong>追问方向：</strong>如何处理数据库重复初始化？如何让 CLI 命令有幂等性？如果多个进程同时写 BoltDB 会怎样？</p>`}
  ],quiz:[
    {q:"createblockchain 主要做什么？",hint:"创建 blocks bucket，写入创世区块，设置 Tip。"},
    {q:"addblock 的核心路径是什么？",hint:"读取 Tip → 创建新区块 → PoW → 序列化 → 写入 DB → 更新 key=l。"},
    {q:"printchain 如何拿到所有区块？",hint:"从 Tip 开始用 Iterator 反向遍历。"}
  ]},
  {title:"第7章：UTXO 交易模型",topics:[

function P(){try{return JSON.parse(localStorage.getItem(STORE)||"{}")}catch{return {}}}
function saveP(p){localStorage.setItem(STORE,JSON.stringify(p));updateProgress()}
function updateProgress(){const p=P();let done=0;breakdownData.forEach(d=>{if(p[`d_${d.day}`])done++});document.getElementById("progressText").textContent=`${done}/${breakdownData.length}`}
function switchMode(mode){S.mode=mode;S.sec=0;S.topic=0;S.q="";const box=document.getElementById("searchInput");if(box)box.value="";document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));render()}
function scrollMain(){const m=document.querySelector(".main");if(m)m.scrollTop=0}
function toggleTheme(){const root=document.documentElement;const next=root.dataset.theme==="dark"?"light":"dark";root.dataset.theme=next;localStorage.setItem("study-theme",next);document.getElementById("themeIcon").textContent=next==="dark"?"☀":"☽"}
function toggleLv(el){el.classList.toggle("open");const body=el.nextElementSibling;body.classList.toggle("open")}
function toggleQuiz(el){const body=el.nextElementSibling;const icon=el.querySelector(".q-toggle");body.classList.toggle("open");if(icon)icon.classList.toggle("open")}
function markDay(day){const p=P();p[`d_${day}`]=true;saveP(p);render()}
function markQuiz(key,state){const p=P();p[key]=state;saveP(p);render()}
function markInterview(dim,qi,state){const p=P();p[`i_${dim}_${qi}`]=state;saveP(p);render()}
function htmlList(items){return `<ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul>`}
function sourceList(items){return `<div class="source-list">${items.map(s=>`<div class="source-item">${s}</div>`).join("")}</div>`}
function lvBlock(cls,tag,title,body){return `<div class="lv-block ${cls}"><div class="lv-header" onclick="toggleLv(this)"><span class="lv-arrow">▶</span><span class="lv-tag">${tag}</span><span style="flex:1;margin-left:8px">${title}</span></div><div class="lv-body">${body}</div></div>`}
function quizItem(q,key,idx){const st=P()[key];const badge=st==="mastered"?'<span class="quiz-status status-mastered">已掌握</span>':st==="review"?'<span class="quiz-status status-review">需复习</span>':"";return `<div class="quiz-item" style="animation-delay:${idx*40}ms"><div class="quiz-q" onclick="toggleQuiz(this)"><span class="q-num">${idx+1}</span><span class="q-text">${q.q}</span>${badge}<span class="q-toggle">▶</span></div><div class="quiz-body"><div class="quiz-hint">${q.hint}</div><div class="quiz-btns"><button class="quiz-btn mastered" onclick="event.stopPropagation();markQuiz('${key}','mastered')">已掌握</button><button class="quiz-btn review" onclick="event.stopPropagation();markQuiz('${key}','review')">需复习</button></div></div></div>`}

function renderIntro(){
  let sb='<div class="sidebar"><div class="side-title">前言</div>';
  introData.pillars.forEach((p,i)=>{sb+=`<div class="side-item ${i===S.sec?'active':''}" onclick="S.sec=${i};render()"><span class="side-main">${p.title}</span><span class="badge">${i+1}</span></div>`});
  sb+='</div>';
  let mn='<div class="main"><article class="markdown-doc">';
  mn+=`<div class="md-kicker">Nakamoto Consensus · 10 Days</div><h1>${introData.title}</h1><p>${introData.desc}</p><div class="md-pill-row"><span class="md-pill">仓库：Kunyanli230/Learn_ProofOfWork</span><span class="md-pill">10 天</span><span class="md-pill">五模式学习</span><span class="md-pill">源码驱动</span></div><blockquote>这页把区块链项目拆成可点击、可自检、可面试复盘的学习工具。</blockquote>`;
  introData.pillars.forEach((p,i)=>{mn+=`<section class="md-section ${S.sec===i?'active':''}"><h2>${p.title}</h2><p>${p.text}</p>`;if(i===1)mn+=htmlList(introData.prerequisites);if(i>=2&&i<=6){const lv=introData.levels[i-2];mn+=`<h3>达标标准</h3><p>${lv.standard}</p><h3>证明方式</h3><p>${lv.proof}</p><h3>下一层目标</h3><p>${lv.next}</p>`}if(i===7)mn+=`<div class="mentor-strip">${introData.method.map(m=>`<div class="mentor-card"><strong>${m.title}</strong><p>${m.text}</p></div>`).join("")}</div>`;if(i===8)mn+=htmlList(introData.outputs);mn+='</section>'});
  mn+=`<hr><section class="md-section"><h2>答题框架</h2><div class="answer-framework">${introData.answerFrame.map(x=>`<div class="framework-step">${x}</div>`).join("")}</div><h2>评分尺</h2><div class="score-grid">${introData.scorecard.map(x=>`<div class="score-card"><strong>${x.title}</strong><p>${x.text}</p></div>`).join("")}</div></section>`;
  mn+=`</article><div class="nav-bar"><div></div><button class="nav-btn primary" onclick="switchMode('learn')">进入知识学习</button></div></div>`;
  return sb+mn;
}

function renderLearn(){
  const ch=learnData[S.ch], topic=ch.topics[S.topic], p=P();
  let sb='<div class="sidebar"><div class="side-title">知识学习</div>';
  learnData.forEach((c,ci)=>{let m=0;c.quiz.forEach((_,qi)=>{if(p[`l_${ci}_${qi}`]==="mastered")m++});const open=ci===S.ch;sb+=`<div class="side-item ${open?'active':''}" onclick="S.ch=${ci};S.topic=0;S.sec=0;render()"><span class="side-main">${c.title}</span><span class="badge">${m}/${c.quiz.length}</span></div><div class="sub-list ${open?'open':''}">`;c.topics.forEach((t,ti)=>{sb+=`<div class="sub-item ${open&&S.sec===0&&S.topic===ti?'active':''}" onclick="S.ch=${ci};S.sec=0;S.topic=${ti};render()">${t.q}</div>`});sb+=`<div class="sub-item ${open&&S.sec===1?'active':''}" onclick="S.ch=${ci};S.sec=1;render()">自检题</div></div>`});
  sb+='</div>';
  let mn='<div class="main">';
  if(S.sec===0){
    mn+=`<div class="content-header"><h1>${ch.title}</h1><div class="subtitle">${topic.q}</div></div><div class="section-card"><h2>${topic.q}</h2>`;
    mn+=lvBlock("lv1","Lv1","概念：是什么、为什么",topic.lv1)+lvBlock("lv2","Lv2","源码：项目里怎么做",topic.lv2)+lvBlock("lv3","Lv3","追问：边界和扩展",topic.lv3);
    mn+='</div><div class="nav-bar">';
    mn+=S.topic>0?`<button class="nav-btn" onclick="S.topic--;render();scrollMain()">上一个知识点</button>`:'<div></div>';
    mn+=S.topic<ch.topics.length-1?`<button class="nav-btn primary" onclick="S.topic++;render();scrollMain()">下一个知识点</button>`:`<button class="nav-btn primary" onclick="S.sec=1;render();scrollMain()">查看自检题</button>`;
    mn+='</div>';
  }else{
    mn+=`<div class="content-header"><h1>${ch.title}</h1><div class="subtitle">自检题</div></div><div class="quiz-section">`;
    ch.quiz.forEach((q,qi)=>{mn+=quizItem(q,`l_${S.ch}_${qi}`,qi)});
    mn+='</div><div class="nav-bar">';
    mn+=`<button class="nav-btn" onclick="S.sec=0;S.topic=${ch.topics.length-1};render();scrollMain()">返回知识点</button>`;
    mn+=S.ch<learnData.length-1?`<button class="nav-btn primary" onclick="S.ch++;S.sec=0;S.topic=0;render();scrollMain()">下一章</button>`:`<button class="nav-btn primary" onclick="switchMode('breakdown')">进入项目拆解</button>`;
    mn+='</div>';
  }
  return sb+mn+'</div>';
}

function renderBreakdown(){
  const day=breakdownData[S.ch], topic=day.topics[S.topic], p=P();
  let sb='<div class="sidebar"><div class="side-title">10 天项目拆解</div>';
  breakdownData.forEach((d,di)=>{const open=di===S.ch,done=p[`d_${d.day}`];sb+=`<div class="side-item ${open?'active':''}" onclick="S.ch=${di};S.sec=0;S.topic=0;render()"><span class="side-main">Day ${d.day}：${d.title}</span><span class="badge">${done?'完成':'学习'}</span></div><div class="sub-list ${open?'open':''}"><div class="sub-item ${open&&S.sec===0?'active':''}" onclick="S.ch=${di};S.sec=0;S.topic=0;render()">今日拆解</div>`;d.topics.forEach((t,ti)=>{sb+=`<div class="sub-item ${open&&S.sec===1&&S.topic===ti?'active':''}" onclick="S.ch=${di};S.sec=1;S.topic=${ti};render()">${t.q}</div>`});sb+=`<div class="sub-item ${open&&S.sec===2?'active':''}" onclick="S.ch=${di};S.sec=2;render()">自检题</div></div>`});
  sb+='</div>';
  let mn='<div class="main">';
  if(S.sec===0){
    mn+=`<div class="hero"><div class="kicker">Project Breakdown · Day ${day.day}</div><h2>${day.title}</h2><p>${day.goal}</p><div class="pill-row"><span class="pill">10 天路线</span><span class="pill">源码 + 面试</span><span class="pill">Nakamoto 共识</span></div></div>`;
    mn+='<div class="grid">';
    mn+=`<div class="panel"><h3>今日学习目标</h3><p>${day.goal}</p><h3>核心关注点</h3>${htmlList(day.focus)}<h3>今日任务</h3>${day.tasks.map(t=>`<div class="checkline"><span>✓</span><div>${t}</div></div>`).join("")}</div>`;
    mn+=`<div class="panel"><h3>源码入口</h3>${sourceList(day.sources)}<button class="nav-btn primary" style="width:100%;margin-top:16px" onclick="markDay(${day.day})">标记 Day ${day.day} 完成</button></div>`;
    mn+=`<div class="panel"><h3>面试打法</h3><div class="answer-framework">${introData.answerFrame.map(x=>`<div class="framework-step">${x}</div>`).join("")}</div><div class="microcopy">今日主线：${day.title}。回答时先给机制结论，再回到 ${day.sources[0]}，最后补充安全边界和扩展。</div></div>`;
    mn+='</div><div class="nav-bar">';
    mn+=S.ch>0?`<button class="nav-btn" onclick="S.ch--;S.sec=0;S.topic=0;render();scrollMain()">上一天</button>`:'<div></div>';
    mn+=`<button class="nav-btn primary" onclick="S.sec=1;S.topic=0;render();scrollMain()">进入今日知识点</button></div>`;
  }else if(S.sec===1){
    mn+=`<div class="content-header"><h1>Day ${day.day}：${day.title}</h1><div class="subtitle">${topic.q}</div></div><div class="section-card"><h2>${topic.q}</h2>`;
    mn+=lvBlock("lv1","Lv1","先建立理解",topic.lv1)+lvBlock("lv2","Lv2","回到源码入口",topic.lv2)+lvBlock("lv3","Lv3","形成追问回答",topic.lv3);
    mn+='</div><div class="nav-bar">';
    mn+=S.topic>0?`<button class="nav-btn" onclick="S.topic--;render();scrollMain()">上一个知识点</button>`:`<button class="nav-btn" onclick="S.sec=0;render();scrollMain()">返回今日拆解</button>`;
    mn+=S.topic<day.topics.length-1?`<button class="nav-btn primary" onclick="S.topic++;render();scrollMain()">下一个知识点</button>`:`<button class="nav-btn primary" onclick="S.sec=2;render();scrollMain()">查看自检题</button>`;
    mn+='</div>';
  }else{
    mn+=`<div class="content-header"><h1>Day ${day.day}：${day.title}</h1><div class="subtitle">自检题</div></div><div class="quiz-section">`;
    day.quiz.forEach((q,qi)=>{mn+=quizItem(q,`b_${S.ch}_${qi}`,qi)});
    mn+='</div><div class="nav-bar">';
    mn+=`<button class="nav-btn" onclick="S.sec=1;S.topic=${day.topics.length-1};render();scrollMain()">返回知识点</button>`;
    mn+=S.ch<breakdownData.length-1?`<button class="nav-btn primary" onclick="markDay(${day.day});S.ch++;S.sec=0;S.topic=0;render();scrollMain()">完成并进入下一天</button>`:`<button class="nav-btn primary" onclick="markDay(${day.day});switchMode('interview')">进入面试模拟</button>`;
    mn+='</div>';
  }
  return sb+mn+'</div>';
}

function renderInterview(){
  const p=P(), dim=interviewData[S.dim];
  let sb='<div class="sidebar"><div class="side-title">面试问答</div>';
  interviewData.forEach((d,di)=>{let label=d.table?"表":`${(d.questions||[]).filter((_,qi)=>p[`i_${di}_${qi}`]).length}/${(d.questions||[]).length}`;sb+=`<div class="side-item ${di===S.dim?'active':''}" onclick="S.dim=${di};render()"><span class="side-main">${d.dim}</span><span class="badge">${label}</span></div>`});
  sb+='</div>';
  let mn='<div class="main">';
  if(dim.table){
    mn+=`<div class="content-header"><h1>高频速查表</h1><div class="subtitle">面试前快速复盘关键数字和关键词</div></div><table class="table"><thead><tr><th>知识点</th><th>要点</th></tr></thead><tbody>`;
    dim.table.forEach(r=>{mn+=`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`});
    mn+='</tbody></table>';
  }else{
    mn+=`<div class="content-header"><h1>${dim.dim}</h1><div class="subtitle">${dim.questions.length} 道题，点击卡片翻转答案</div></div><div class="toolbar"><button class="tool-btn primary" onclick="randomQ()">随机抽题</button><span class="timer" id="timerDisp">00:00</span><button class="tool-btn" id="timerBtn" onclick="toggleTimer()">开始计时</button></div><div class="card-grid">`;
    dim.questions.forEach((q,qi)=>{const st=p[`i_${S.dim}_${qi}`];mn+=`<div class="card ${st?'':''}" onclick="this.classList.toggle('flipped')" style="animation-delay:${qi*35}ms"><div class="card-inner"><div class="card-face card-front"><div class="card-idx">Q${qi+1}</div><div class="card-title">${q.q}</div><span class="card-tag">${dim.dim}${st?' · 已标记':''}</span></div><div class="card-face card-back"><h4>参考答案</h4><p>${q.a}</p><h4>答题结构</h4><p>${introData.answerFrame.join(" → ")}</p>${q.code?`<h4>代码关联</h4><p class="code-link">${q.code}</p>`:""}${q.follow?`<h4>追问方向</h4><p>${q.follow}</p>`:""}<div class="card-actions"><button class="card-action practice" onclick="event.stopPropagation();markInterview(${S.dim},${qi},'practice')">已练习</button><button class="card-action review" onclick="event.stopPropagation();markInterview(${S.dim},${qi},'review')">需复习</button></div></div></div></div>`});
    mn+='</div>';
  }
  return sb+mn+'</div>';
}

function renderScenario(){
  let sb='<div class="sidebar"><div class="side-title">场景还原</div>';
  sb+=`<div class="side-item ${S.sec===0?'active':''}" onclick="S.sec=0;render()"><span class="side-main">端到端流程</span><span class="badge">${scenarioData.e2e.length}</span></div>`;
  sb+=`<div class="side-item ${S.sec===1?'active':''}" onclick="S.sec=1;render()"><span class="side-main">故障排查</span><span class="badge">${scenarioData.fault.length}</span></div></div>`;
  let mn='<div class="main">';
  if(S.sec===0){
    mn+=`<div class="content-header"><h1>端到端场景还原</h1><div class="subtitle">把请求从命令入口追到数据与网络</div></div><div class="grid">`;
    scenarioData.e2e.forEach(sc=>{mn+=`<div class="panel"><h3>${sc.title}</h3><p>${sc.desc}</p>${sourceList(sc.steps.map((st,i)=>`${i+1}. ${st.s}<br>${st.loc}<br>${st.detail}`))}</div>`});
    mn+='</div>';
  }else{
    mn+=`<div class="content-header"><h1>故障排查场景</h1><div class="subtitle">训练存储损坏、网络分区和算力攻击下的回答</div></div><div class="grid">`;
    scenarioData.fault.forEach(sc=>{mn+=`<div class="panel"><h3>${sc.title}</h3><p>${sc.desc}</p>${sc.impacts.map(im=>`<div class="score-card" style="margin-top:10px"><strong>${im.what}</strong><p>${im.detail}</p><p>${im.fix}</p></div>`).join("")}</div>`});
    mn+='</div>';
  }
  return sb+mn+'</div>';
}

function collectSearch(){
  const rows=[];
  introData.pillars.forEach((p,i)=>rows.push({m:"intro",title:p.title,snip:p.text,go:()=>{switchMode("intro");S.sec=i;render()}}));
  learnData.forEach((c,ci)=>{c.topics.forEach((t,ti)=>rows.push({m:"learn",title:`${c.title} · ${t.q}`,snip:(t.lv1+t.lv2+t.lv3).replace(/<[^>]+>/g,""),go:()=>{switchMode("learn");S.ch=ci;S.topic=ti;S.sec=0;render()}}));c.quiz.forEach((q,qi)=>rows.push({m:"learn",title:`${c.title} · 自检题`,snip:q.q+" "+q.hint,go:()=>{switchMode("learn");S.ch=ci;S.sec=1;render()}}))});
  breakdownData.forEach((d,di)=>rows.push({m:"breakdown",title:`Day ${d.day}：${d.title}`,snip:d.goal+" "+d.focus.join(" "),go:()=>{switchMode("breakdown");S.ch=di;S.sec=0;render()}}));
  interviewData.forEach((d,di)=>(d.questions||[]).forEach((q,qi)=>rows.push({m:"interview",title:`${d.dim} · ${q.q}`,snip:q.a+" "+(q.follow||""),go:()=>{switchMode("interview");S.dim=di;render()}})));
  scenarioData.e2e.forEach((s,i)=>rows.push({m:"scenario",title:s.title,snip:s.desc,go:()=>{switchMode("scenario");S.sec=0;render()}}));
  scenarioData.fault.forEach((s,i)=>rows.push({m:"scenario",title:s.title,snip:s.desc,go:()=>{switchMode("scenario");S.sec=1;render()}}));
  return rows;
}
let searchRows=collectSearch();
function escReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function hl(text,q){return text.replace(new RegExp(escReg(q),"gi"),m=>`<mark>${m}</mark>`)}
function handleSearch(q){S.q=q.trim();if(S.q)renderSearch();else render()}
function renderSearch(){
  const q=S.q.toLowerCase();const res=searchRows.filter(r=>(r.title+" "+r.snip).toLowerCase().includes(q)).slice(0,80);
  let h='<div class="sidebar"><div class="side-title">搜索</div><div class="side-item active"><span class="side-main">搜索结果</span><span class="badge">'+res.length+'</span></div></div><div class="main search-results">';
  h+=`<div class="content-header"><h1>搜索结果</h1><div class="subtitle">"${S.q}"，找到 ${res.length} 条匹配</div></div>`;
  res.forEach((r,i)=>{h+=`<div class="search-result" onclick="jumpSearch(${i})"><div class="sr-mode">${r.m}</div><div class="sr-title">${hl(r.title,S.q)}</div><div class="sr-snippet">${hl(r.snip.slice(0,180),S.q)}</div></div>`});
  h+='</div>';document.getElementById("app").innerHTML=h;window.__searchRes=res;
}
function jumpSearch(i){const r=window.__searchRes[i];if(r)r.go()}

let timer=null,t0=0,elapsed=0;
function toggleTimer(){const btn=document.getElementById("timerBtn");if(timer){clearInterval(timer);timer=null;elapsed+=Date.now()-t0;btn.textContent="继续计时";return}t0=Date.now();btn.textContent="暂停计时";timer=setInterval(()=>{const ms=elapsed+Date.now()-t0;const s=Math.floor(ms/1000);document.getElementById("timerDisp").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},250)}
function randomQ(){const dim=interviewData[S.dim];if(!dim.questions||!dim.questions.length)return;const cards=document.querySelectorAll(".card");const i=Math.floor(Math.random()*cards.length);cards[i]?.scrollIntoView({behavior:"smooth",block:"center"});cards[i]?.classList.add("flipped")}

function render(){
  if(S.q){renderSearch();return}
  let html=S.mode==="intro"?renderIntro():S.mode==="learn"?renderLearn():S.mode==="breakdown"?renderBreakdown():S.mode==="interview"?renderInterview():renderScenario();
  document.getElementById("app").innerHTML=html;
  updateProgress();
}
const savedTheme=localStorage.getItem("study-theme");if(savedTheme){document.documentElement.dataset.theme=savedTheme;document.getElementById("themeIcon").textContent=savedTheme==="dark"?"☀":"☽"}
render();
</script>
</body>
</html>
