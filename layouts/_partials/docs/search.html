{{ if default true .Site.Params.BookSearch }}
<div class="book-search hidden">
  <div class="book-search-topbar">
    <div>
      <strong>搜索知识库</strong>
      <small>按标题、正文、栏目或日期查找</small>
    </div>
    <button id="book-search-close" class="book-search-close" type="button" aria-label="关闭搜索">×</button>
  </div>
  <div class="book-search-field">
    <input id="book-search-input" type="text"
      placeholder="{{ partial "docs/text/i18n" "Search" }}"
      aria-label="{{ partial "docs/text/i18n" "Search" }}"
      maxlength="64" data-hotkeys="s/" />
    <div class="book-search-spinner hidden"></div>
    <button id="book-search-clear" class="book-search-clear hidden" type="button" aria-label="清空搜索">清空</button>
  </div>
  <div id="book-search-filters" class="book-search-filters" role="group" aria-label="按栏目筛选">
    <button class="book-search-filter" type="button" data-search-category="" aria-pressed="true">全部</button>
    <button class="book-search-filter" type="button" data-search-category="面试真题" aria-pressed="false">面试真题</button>
    <button class="book-search-filter" type="button" data-search-category="八股总结" aria-pressed="false">八股总结</button>
    <button class="book-search-filter" type="button" data-search-category="资源荟萃" aria-pressed="false">资源荟萃</button>
    <button class="book-search-filter" type="button" data-search-category="技术博客" aria-pressed="false">技术博客</button>
    <button class="book-search-filter" type="button" data-search-category="配套文章" aria-pressed="false">配套文章</button>
    <button class="book-search-filter" type="button" data-search-category="项目学习" aria-pressed="false">项目学习</button>
    <button class="book-search-filter" type="button" data-search-category="求职就业" aria-pressed="false">求职就业</button>
  </div>
  <div class="book-search-summary">
    <div id="book-search-status" class="book-search-status hidden" aria-live="polite"></div>
  </div>
  <ul id="book-search-results" aria-label="搜索结果"></ul>
</div>
<button id="book-search-backdrop" class="book-search-backdrop hidden" type="button" aria-label="关闭搜索"></button>
<script>document.querySelector(".book-search").classList.remove("hidden")</script>
{{ end }}
