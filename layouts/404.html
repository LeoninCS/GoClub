<!DOCTYPE html>
<html lang="zh-CN">
<head>
  {{ partial "docs/html-head" . }}
  {{ partial "docs/inject/head" . }}
</head>
<body class="kind-404">
  <a class="skip-link" href="#main">跳到正文</a>

  <div class="shell">
    {{ partial "docs/header" . }}

    <main id="main" class="main">
      <div class="notfound">
        <span class="notfound-code">ERROR 404</span>
        <h1>页面不存在</h1>
        <p class="notfound-lead">链接可能已失效，或内容改过名字。</p>
        <div class="notfound-actions">
          <a class="btn btn--primary" href="{{ .Site.Home.RelPermalink }}">返回首页</a>
          <button type="button" class="btn" data-search-trigger>搜索内容</button>
        </div>
      </div>
    </main>

    {{ partial "docs/footer" . }}
  </div>

  {{ partial "docs/search" . }}
  {{ partial "docs/inject/scripts" . }}
  {{ partial "goclub/umami-stats" . }}
</body>
</html>
