<script>
    (function () {
      var doc = document;

      var toggle = doc.getElementById('theme-toggle');
      var sun = doc.getElementById('sun-icon');
      var moon = doc.getElementById('moon-icon');
      function isDark() {
        var t = doc.documentElement.getAttribute('data-theme');
        if (t === 'dark' || t === 'warm') return true; // warm 为旧值，按 dark 处理
        if (t === 'light') return false;
        return window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      function paintTheme() {
        var dark = isDark();
        if (sun) sun.style.display = dark ? 'none' : 'block';
        if (moon) moon.style.display = dark ? 'block' : 'none';
      }
      paintTheme();
      if (toggle) {
        toggle.addEventListener('click', function () {
          var next = isDark() ? 'light' : 'dark';
          doc.documentElement.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) {}
          paintTheme();
        });
      }

      var sheet = doc.getElementById('nav-sheet');
      var openers = doc.querySelectorAll('[data-nav-open]');
      var closers = doc.querySelectorAll('[data-nav-close]');
      function setSheet(open) {
        if (!sheet) return;
        sheet.classList.toggle('is-open', open);
        doc.body.classList.toggle('sheet-open', open);
        openers.forEach(function (b) { b.setAttribute('aria-expanded', String(open)); });
        if (open) {
          var first = sheet.querySelector('a, button');
          if (first) first.focus({ preventScroll: true });
        }
      }
      openers.forEach(function (b) { b.addEventListener('click', function () { setSheet(true); }); });
      closers.forEach(function (b) { b.addEventListener('click', function () { setSheet(false); }); });
      doc.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && sheet && sheet.classList.contains('is-open')) setSheet(false);
      });
      doc.addEventListener('click', function (e) {
        if (e.target.closest('.sheet [data-search-trigger]')) setSheet(false);
      });

      doc.querySelectorAll('details.qa-answer').forEach(function (el) {
        var summary = el.querySelector('summary.qa-answer-toggle');
        if (!summary) return;
        var update = function () { summary.textContent = el.open ? '收起答案' : '查看答案'; };
        el.addEventListener('toggle', update);
        update();
      });
    })();
  </script>

  <script>
    (function () {
      // 右侧大纲滚动高亮（fork inject/body 的等效实现，上游壳改动两点：
      // ① 大纲在 .toc-pane nav 里；② 详情页滚 .article-pane，不滚 window）。
      // 当前标题对应的大纲链接加 .active（品牌色标记段由 CSS ::before 绘制）。
      var toc = document.querySelector('.toc-pane nav');
      if (!toc) return;
      var links = Array.prototype.slice.call(toc.querySelectorAll('a[href^="#"]'));
      if (!links.length) return;
      var byId = {};
      links.forEach(function (a) {
        byId[decodeURIComponent(a.getAttribute('href').slice(1))] = a;
      });
      var heads = Object.keys(byId)
        .map(function (id) { return document.getElementById(id); })
        .filter(Boolean);
      if (!heads.length) return;
      var pane = document.querySelector('.article-pane');
      var current = null;
      function setActive(id) {
        if (current === id) return;
        current = id;
        links.forEach(function (a) { a.classList.remove('active'); });
        if (id && byId[id]) byId[id].classList.add('active');
      }
      // 激活规则与 fork 一致：最后一个越过「顶栏高 + 32px」线的标题为当前节。
      var ticking = false;
      function update() {
        ticking = false;
        var line = 64 + 32;
        var id = heads.length ? heads[0].id : null;
        for (var i = 0; i < heads.length; i++) {
          if (heads[i].getBoundingClientRect().top <= line) id = heads[i].id;
          else break;
        }
        setActive(id);
      }
      function onScroll() {
        if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
      }
      if (pane) pane.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', update);
      update();
    })();
  </script>
