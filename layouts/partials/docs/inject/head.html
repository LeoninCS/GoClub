{{/* Fredoka（BotsRouter 同款品牌 display 字）：首页大字标 + 导航栏品牌字都用它（用户 2026-10-23 亲定）；
     2026-11-05 用户令改为网站自托管（static/fonts/fredoka-latin.woff2 + @font-face），不再经过谷歌下载。 */}}

<style>
  :root {
    --goclub-font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --goclub-font-headline: var(--goclub-font-body);
  }
</style>

<script>
  (function () {
    // 主题：light / dark（我们站的 dark，底 #1b1b1f；旧 warm 值按 dark 处理）
    var theme = localStorage.getItem('theme') || 'auto';
    if (theme === 'warm') theme = 'dark'; // 兼容旧值
    var darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
    if (theme === 'dark' || (theme === 'auto' && darkQuery.matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else if (theme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
    // 统计脚本放到 load 之后再加载，避免第三方域名拖慢首屏指标
    window.addEventListener('load', function () {
      var s = document.createElement('script');
      s.src = 'https://cloud.umami.is/script.js';
      s.defer = true;
      s.setAttribute('data-website-id', '19d48c9b-1602-4bc0-ad04-9f819006ec0b');
      document.head.appendChild(s);
    });
  })();
</script>
