<footer class="statusbar goclub-umami-stats">
  <div class="status-left">
    <span>© {{ now.Year }} GoClub</span>
    <span class="status-sep" aria-hidden="true">/</span>
    <span>内容由社区整理</span>
  </div>

  <div class="status-live" aria-label="站点访问统计">
    <span class="live-now"><i aria-hidden="true"></i>在线 <b data-umami-stat="active">–</b> 人</span>
    <span class="live-group">
      <em>今日</em>
      <span>浏览 <b data-umami-stat="t_pageviews">–</b></span>
      <span>访客 <b data-umami-stat="t_visitors">–</b></span>
      <span>访问 <b data-umami-stat="t_visits">–</b></span>
    </span>
    <span class="live-group is-total">
      <em>累计</em>
      <span>浏览 <b data-umami-stat="pageviews">–</b></span>
      <span>访客 <b data-umami-stat="visitors">–</b></span>
      <span>访问 <b data-umami-stat="visits">–</b></span>
    </span>
  </div>
</footer>
