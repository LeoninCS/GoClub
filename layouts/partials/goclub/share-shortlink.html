{{/* Bind copy behavior to the server-rendered short-link button in the page lead. */}}
{{ with .Params.shortlink }}
<script>
  (function () {
    function bind(btn) {
      if (btn.getAttribute('data-share-bound') === 'true') return;

      var shortURL = btn.getAttribute('data-short-url');
      var label = btn.querySelector('.goclub-share-label');
      if (!shortURL || !label) return;

      btn.setAttribute('data-share-bound', 'true');
      var timer = null;

      function flash(text) {
        var copied = text === '已复制';
        label.textContent = text;
        btn.classList.toggle('is-done', copied);
        btn.classList.toggle('is-error', !copied);
        btn.setAttribute('aria-label', copied ? '短链已复制' : text);
        window.clearTimeout(timer);
        timer = window.setTimeout(function () {
          label.textContent = '复制短链';
          btn.classList.remove('is-done');
          btn.classList.remove('is-error');
          btn.setAttribute('aria-label', '复制本页短链接');
        }, 1800);
      }

      function fallbackCopy() {
        var ta = document.createElement('textarea');
        ta.value = shortURL;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
      }

      btn.addEventListener('click', function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shortURL).then(function () {
            flash('已复制');
          }, function () {
            flash(fallbackCopy() ? '已复制' : '复制失败');
          });
        } else {
          flash(fallbackCopy() ? '已复制' : '复制失败');
        }
      });
    }

    var buttons = document.querySelectorAll('.goclub-share[data-short-url]');
    for (var i = 0; i < buttons.length; i += 1) {
      bind(buttons[i]);
    }
  })();
</script>
{{ end }}
